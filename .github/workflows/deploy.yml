name: Проверки и деплой

# Карты раздаются статикой с GitHub Pages. В ЭТОМ ФОРКЕ публикуются только DP
# (корень) и MEIO (подкаталог /meio/) — см. шаг сборки ниже. В исходном
# репозитории из корня раздаётся SNP, а MRP из /mrp/. Обе собираются одной командой
# npm run build в один dist/ и уезжают ОДНОЙ публикацией: промежуточного
# состояния «новая карта уже есть, старая ещё старая» не бывает.
# Публикуется только собранный dist/ — исходники, презентации и макет
# остаются в репозитории, но сайтом не раздаются.
#
# ВЕРСИИ ACTIONS (process-map-vjz.9). Раннеры перешли на Node 24, а 23.09.2026
# Node 20 удаляется из образа совсем — прежние v4/v3 не предупреждали бы, а
# ломались. Версии подняты по полю runs.using в манифесте тега, а не по release
# notes: у upload-artifact заявленная в v5 поддержка Node 24 на деле осталась
# node20, минимум там v6. Предупреждение про upload-artifact в job build
# приходило не отсюда — этот шаг лежит внутри upload-pages-artifact, и её v3 и
# v4 обе тянут node20-версию, поэтому нужна ровно v5.

# ПРОВЕРКИ НА PR (process-map-vjz.7). Раньше триггера pull_request не было
# вовсе: на PR не запускалось ничего, и всё выяснялось уже после вливания.
#
# Проверки НЕ вынесены в отдельный workflow намеренно. Разделение выглядело
# аккуратнее, но ломало главное свойство, ради которого e2e и заводили в CI:
# деплой обязан ждать проверок. Два независимых workflow друг о друге не знают,
# и на push в main деплой уехал бы даже при красном CI. Здесь же зависимость
# выражена прямо — `deploy: needs: [build, e2e]`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# По умолчанию — минимум. Права на публикацию выданы точечно job'у deploy,
# чтобы прогоны PR их не получали (process-map-vjz.7).
permissions:
  contents: read

# Деплой и проверки живут в разных группах. Для деплоя группа статическая и без
# отмены: начатый доводится до конца, чтобы Pages не остался с полузалитой
# сборкой. Для PR — своя группа на ветку с отменой устаревших: ждать прогон,
# результат которого уже неактуален, незачем.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Версия из .nvmrc: npm run layout требует Node >= 22.6
      # (node --experimental-strip-types), см. engines в package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сломанная сборка не должна попасть на Pages: сначала проверки.
      # npm run check это tsc + eslint + vitest + prettier --check
      # (process-map-mx2). e2e гоняются соседним job'ом e2e: им нужны браузеры
      # Playwright, и ставить их ради сборки незачем — job'ы идут параллельно.
      - run: npm run check

      # ФОРК ВЛАДЕЛЬЦА МОДУЛЕЙ DP И MEIO: сайт раздаёт ТОЛЬКО его карты.
      #
      # Решение владельца форка от 07.09.2026: snp и mrp — карты владельца
      # репозитория, и на его стенде им не место.
      #
      # ПОЧЕМУ ПРАВКА ЗДЕСЬ, А НЕ В КОДЕ. Убрать карты из сборки «по-честному»
      # значило бы сменить DEFAULT_MAP со snp на dp: карта по умолчанию
      # раздаётся из корня, остальные из подкаталогов, и без неё корень сайта
      # пуст. Но смена DEFAULT_MAP роняет десять e2e-спеков — они гоняются
      # проектом snp против порта карты по умолчанию и содержат подписи узлов
      # SNP дословно, — и делает ветку непригодной для PR в исходный
      # репозиторий. Поэтому исходники не тронуты вовсе: снимается только то,
      # что уезжает на Pages.
      #
      # Собираются ровно две карты в свои подкаталоги, затем DP поднимается в
      # корень — иначе адрес без суффикса отдавал бы 404.
      - run: npm run build:dp && npm run build:meio
      - name: DP в корень; чужих карт в артефакте быть не должно
        run: |
          mv dist/dp/* dist/
          rmdir dist/dp
          test ! -e dist/snp
          test ! -e dist/mrp
          test -f dist/index.html
          test -f dist/meio/index.html
          ls -la dist

      # base: './' в vite.config.ts (SPEC §6) делает пути относительными,
      # поэтому сборка работает из подкаталога /process-map/ без правок.
      # На PR артефакт не нужен: деплоя там не будет, а квота расходуется.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Задача process-map-vjz.3. До неё e2e не запускались в CI вовсе, и флак
  # process-map-6ja месяц падал в половине локальных прогонов, ни разу не
  # будучи пойманным pipeline.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Только chromium: в playwright.config.ts два проекта (snp и mrp), но оба
      # на chromium — проекты там разделяют карты, а не браузеры. Установка без
      # имени браузера тянула бы ещё firefox и webkit впустую.
      - run: npx playwright install --with-deps chromium

      # Dev-сервер поднимает сам Playwright (webServer в конфиге) — отдельного
      # шага здесь быть не должно: в CI reuseExistingServer=false, и на занятом
      # порту прогон упал бы с «is already used».
      - run: npm run e2e

      # Без этого от падения в CI осталась бы только текстовая простыня лога:
      # трейс и HTML-отчёт пишутся в файлы. if: !cancelled() — отчёт нужен
      # именно когда прогон красный.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    # Решение владельца: e2e блокируют деплой — сломанное не уезжает на стенд.
    needs: [build, e2e]
    # На PR деплоить нечего и некуда: окружение github-pages защищено правилом
    # «только ветка по умолчанию», и job всё равно был бы отклонён.
    if: github.event_name != 'pull_request'
    # Права на публикацию — только здесь, а не на весь workflow: actions: read
    # требует deploy-pages начиная с v4 (process-map-vjz.9).
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
